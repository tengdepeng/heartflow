[package]
name = "heartflow-core"
version = "0.1.0"
description = "Heartflow 心流工坊桌面端 Rust 后端 · 跨端配对接收端"
edition = "2021"
authors = ["Heartflow"]
license = "MIT"

[lib]
name = "heartflow_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
axum = { version = "0.7" }
rand = "0.8"
